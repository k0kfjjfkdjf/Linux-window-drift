# windrift — конфигурация
# Править можно вручную или через `windrift settings`.
# На второй машине конфиг зеркальный: свой name, а в [peer] — эта машина.
# `windrift setup-peer` создаёт его там автоматически.

# ── Эта машина ───────────────────────────────────────────────
name = "pc"
# имя этой машины (любое, без пробелов)

token = "замени-на-длинную-случайную-строку"
# общий секрет, ОДИНАКОВЫЙ на обеих машинах (openssl rand -hex 32)

port = 7781
# порт демона

listen = "0.0.0.0"
# на каком адресе слушает демон: "0.0.0.0" — все интерфейсы,
# лучше указать IP в локальной сети или WireGuard-интерфейса

backend = "hyprland"
# как узнать активное окно: "hyprland" | "kde" (нужен kdotool) | "sway"

notify = true
# показывать ошибки через notify-send

# ── Буфер обмена ─────────────────────────────────────────────
clipboard = true
# синхронизировать текстовый буфер обмена с соседом

clipboard_interval = 0.5
# как часто проверять буфер, секунд

clipboard_max_kb = 1024
# не пересылать текст больше этого размера, КБ

# ── Сосед ────────────────────────────────────────────────────
[peer]
name = "laptop"
# имя соседа — должно совпадать с его name

host = "192.168.1.20"
# IP или имя соседа в сети (для связи демонов)

port = 7781
# порт демона соседа

ssh = "user@192.168.1.20"
# как зайти к соседу по ssh: "user@192.168.1.20" или алиас из ~/.ssh/config
# вход должен быть по ключу, без пароля

# ── xpra ─────────────────────────────────────────────────────
[xpra]
display_base = 100
# с какого номера X-дисплея нумеровать сессии (:100, :101, ...)

encoding = "auto"
# кодирование картинки: "auto" | "rgb" | "png" | "jpeg" | "webp" | "h264" | "vp8" | "vp9"

quality = 0
# качество для сжатия с потерями, 1–100; 0 — пусть xpra решает сам

speaker = false
# пересылать звук программы (нужен gst-python)

microphone = false
# пересылать микрофон в программу

server_args = []
# доп. аргументы для `xpra start`, например ["--dpi=120"]

attach_args = []
# доп. аргументы для `xpra attach`, например ["--desktop-scaling=off"]

# ── Установка на соседа (windrift setup-peer) ────────────────
[setup]
repo = "https://github.com/k0kfjjfkdjf/Linux-window-drift.git"
dir = "~/Linux-window-drift"
packages = ["git", "xpra", "wl-clipboard", "python", "openssh", "libnotify", "python-gobject", "gtk4"]
