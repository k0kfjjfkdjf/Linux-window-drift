# windrift — конфигурация
# Править можно вручную или через `windrift settings`.
# На второй машине конфиг зеркальный: свой name, а в [peer] — эта машина.
# `windrift setup-peer` создаёт его там автоматически.

# ── Эта машина ───────────────────────────────────────────────
name = "pc"
# имя этой машины (любое, без пробелов)

token = "замени-на-длинную-случайную-строку"
# общий секрет, ОДИНАКОВЫЙ на обеих машинах (openssl rand -hex 32)

port = 7781
# порт демона

listen = "0.0.0.0"
# на каком адресе слушает демон: "0.0.0.0" — все интерфейсы,
# лучше указать IP в локальной сети или WireGuard-интерфейса

backend = "auto"
# как узнать активное окно: "auto" (определить самому) | "hyprland" | "kde" (нужен kdotool)
# | "sway" | "x11" (Xfce и другие X11-столы, нужен xdotool)

notify = true
# показывать ошибки через notify-send

# ── Окна, пришедшие с соседа ─────────────────────────────────
keep_proportions = true
# занимать ту же долю экрана и стоять в том же месте, что и у соседа
# (в процентах, а не в пикселях); false — только ужать, если не влезает

decorations = true
# X11: рисовать рамку с кнопками, даже если программа просила без неё

# ── Общая мышь (windrift mouse, через Deskflow) ──────────────
peer_side = "right"
# с какой стороны от этого экрана стоит сосед: "right" | "left" | "up" | "down"

mouse_port = 24800
# порт Deskflow

# ── Буфер обмена ─────────────────────────────────────────────
clipboard = true
# синхронизировать текстовый буфер обмена с соседом

clipboard_interval = 0.5
# как часто проверять буфер, секунд

clipboard_max_kb = 1024
# не пересылать текст больше этого размера, КБ

# ── Сосед ────────────────────────────────────────────────────
[peer]
name = "laptop"
# имя соседа — должно совпадать с его name

host = "192.168.1.20"
# IP или имя соседа в сети (для связи демонов)

port = 7781
# порт демона соседа

ssh = "user@192.168.1.20"
# как зайти к соседу по ssh: "user@192.168.1.20" или алиас из ~/.ssh/config
# вход должен быть по ключу, без пароля

# ── xpra ─────────────────────────────────────────────────────
[xpra]
display_base = 100
# с какого номера X-дисплея нумеровать сессии (:100, :101, ...)

encoding = "auto"
# кодирование картинки: "auto" | "rgb" | "png" | "jpeg" | "webp" | "h264" | "vp8" | "vp9"

quality = 0
# качество для сжатия с потерями, 1–100; 0 — пусть xpra решает сам

speaker = false
# пересылать звук программы (нужен gst-python)

microphone = false
# пересылать микрофон в программу

server_args = []
# доп. аргументы для `xpra start`, например ["--dpi=120"]

attach_args = []
# доп. аргументы для `xpra attach`, например ["--desktop-scaling=off"]

# ── Установка на соседа (windrift setup-peer) ────────────────
[setup]
repo = "https://github.com/k0kfjjfkdjf/Linux-window-drift.git"
dir = "~/Linux-window-drift"
packages = ["git", "xpra", "wl-clipboard", "python", "openssh", "libnotify", "python-gobject", "gtk4", "gstreamer", "gst-plugins-base", "gst-plugins-good", "gst-plugins-ugly", "gst-libav", "gst-python"]
# дополнительные пакеты для соседа на Arch (pacman); обязательные ставятся всегда

packages_apt = ["git", "xpra", "xpra-x11", "python3", "xclip", "xdotool", "x11-utils", "wl-clipboard", "gstreamer1.0-tools", "gstreamer1.0-plugins-base", "gstreamer1.0-plugins-good", "gstreamer1.0-plugins-ugly", "gstreamer1.0-libav", "gstreamer1.0-x", "python3-gst-1.0", "gir1.2-gst-plugins-base-1.0", "libnotify-bin", "openssh-server", "python3-gi", "gir1.2-gtk-4.0"]
# дополнительные пакеты для соседа на Debian/Ubuntu/Armbian (apt); обязательные ставятся всегда

xpra_channel = "stable"
# на Debian xpra ставится из репозитория xpra.org: "stable" | "lts" | "beta"
